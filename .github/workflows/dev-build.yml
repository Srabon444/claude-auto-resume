name: Dev build

on:
  push:
    branches: [dev]

permissions:
  contents: write

concurrency:
  group: dev-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx vsce package
      - name: Publish the dev release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete dev-build --cleanup-tag --yes || true
          gh release create dev-build ./*.vsix --target "$GITHUB_SHA" --prerelease \
            --title "Dev build" \
            --notes "Built from dev at $GITHUB_SHA. Download the .vsix, then Extensions, the three dots, Install from VSIX."
